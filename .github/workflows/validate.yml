name: Validate provider catalog
on:
  push:
    paths: ['providers.json', 'providers.example.json', 'validate.mjs', '.github/workflows/validate.yml']
  pull_request:
    paths: ['providers.json', 'providers.example.json', 'validate.mjs', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node validate.mjs providers.json
      - run: node validate.mjs providers.example.json
